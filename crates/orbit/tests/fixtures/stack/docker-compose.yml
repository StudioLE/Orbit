x-orbit:
  host: ssh://example-host

services:
  app:
    image: alpine
    command: sleep 3600
    x-orbit:
      environment:
      - API_TOKEN
      - source: MAIL_PASSWORD
        target: SMTP_PASSWORD
      secrets:
      - TLS_KEY
      - source: SIGNING_KEY
        target: /etc/app/signing.key
      configs:
      - source: ./app.conf
        target: /etc/app.conf
      - source: ./script.sh
        target: /script.sh
        mode: 0755
    secrets:
    - orbit

secrets:
  orbit:
    external: true
